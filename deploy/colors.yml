profile: zhealth
workdir: .colors
compute-api-version: 2

provider-compute: vultr
provider-backend: r2
provider-smtp: resend
# Cloudflare zone (registrar stays 1stdomains). ONCE creates the proxied A
# record for each app host plus the Resend records. Needs
# COLORS_PAR_CLOUDFLARE_API_TOKEN (Zone > DNS > Edit on zhealth.nz).
provider-dns: cloudflare
compute-prevent-destroy: true

# Sydney is Vultr's closest region to NZ. 2 GB leaves room for Docker,
# ONCE and the JVM; 2284 is Ubuntu 24.04 LTS x64.
vultr-region: syd
vultr-plan: vc2-1c-1gb
vultr-os-id: 2284

# TCP 22 and TCP 80/443. Narrow SSH to your own CIDR if practical.
compute-ssh-sources: [0.0.0.0/0]
compute-http-sources: [0.0.0.0/0]

# Existing R2 bucket for OpenTofu state (must exist before create).
r2-bucket: frap-tofu-state-bucket
r2-endpoint: https://c9c86b356060fcef957c2a47613ff5b4.r2.cloudflarestorage.com

once:
  applications:
    - host: zhealth.nz
      image: ghcr.io/frap/zhealth:latest
      # Publishes a deploy key to the GitHub "zhealth" environment so merges
      # to main can redeploy (.github/workflows/deploy.yml)
      github: frap/zhealth
